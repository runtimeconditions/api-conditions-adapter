[project]
name = "api-conditions-adapter"
version = "0.1.0"
description = "A platform adapter that resolves API conditions using the Backstage API"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
generate-cnp = "api_conditions_adapter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api_conditions_adapter"]
